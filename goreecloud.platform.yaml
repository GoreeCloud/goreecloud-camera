# GoreeCloud Camera Platform Contract declaration
# File internal version: 0.1.0
# Declaration validity does not prove implementation or acceptance.

schema_version: "0.2"

component:
  type: application
  id: goreecloud-camera
  product_name: GoreeCloud Camera
  repository: GoreeCloud/goreecloud-camera

lifecycle: concept
version: "0.1.0"

supported_platforms:
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "No GoreeCloud Manager integration is implemented or accepted in the Camera foundation."
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "The foundation source deliberately requests only camera permission and has no network, location, audio, or media-library permission; Privacy Shield runtime integration is still unimplemented and unaccepted."
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "Camera session ownership is centralized in the initial controller source, but Wardveil Security runtime integration and acceptance do not yet exist."
  everkeep:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "No media finalization, portability evidence, or Everkeep runtime integration exists yet."
  glaze_ui:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "Glaze UI 1.4.1 remains the required consumer target; the current engineering preview shell intentionally does not claim Glaze UI conformance."
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "No Mesh coordination is implemented; remote and cross-device workflows remain future work."
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "Core local preview does not require identity; optional identity-bound workflows remain unimplemented and unaccepted."

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: false
    requirements:
      - "Camera does not own general media backup; downstream backup must respect capture privacy policy."
  restore:
    required: false
    requirements:
      - "Camera does not own general media-library restore; recoverable in-progress capture state is a separate reliability requirement."
  export:
    required: true
    requirements:
      - "Captured media must remain exportable as ordinary user-owned files once still/video persistence is implemented."
      - "Metadata export must support privacy-aware policies when implemented."
  portability:
    required: true
    requirements:
      - "Primary media must remain usable without GoreeCloud Camera once media capture is implemented."
      - "RAW, Motion Photo relationships, sidecars, and provenance data must remain portable when those features are implemented."

external_dependencies: []

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.4.1"
  requires: []
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: unverified
  validated_at: null
  evidence: []
  blockers:
    - "No supported real-device Camera preview qualification evidence exists."
    - "No still-photo or video media persistence/finalization is implemented."
    - "No Platform System integration acceptance evidence exists."
    - "No release or production-acceptance evidence exists."
    - "A recognized open-source repository license has not yet been selected."
