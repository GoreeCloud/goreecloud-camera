health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: false
    requirements:
      - "Camera does not own general media backup; downstream backup must respect capture privacy policy."
  restore:
    required: false
    requirements:
      - "Camera does not own general media-library restore; recoverable in-progress capture state is a separate reliability requirement."
  export:
    required: true
    requirements:
      - "Captured media must remain exportable as ordinary user-owned files."
      - "Metadata export must support privacy-aware policies when implemented."
  portability:
    required: true
    requirements:
      - "Primary media must remain usable without GoreeCloud Camera."
      - "RAW, Motion Photo relationships, sidecars, and provenance data must remain portable when those features are implemented."

external_dependencies: []

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.4.1"
  requires: []
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: unverified
  validated_at: null
  evidence: []
