  wardveil_security:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "Wardveil Security boundaries are specified but no Camera runtime integration or acceptance evidence exists."
  everkeep:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "Everkeep portability and preservation requirements are specified but no runtime integration evidence exists."
  glaze_ui:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "Glaze UI 1.4.1 is the current required consumer target; no Camera UI implementation or acceptance evidence exists."
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "Mesh coordination is planned for applicable first-party interactions such as future remote or integration workflows; no implementation evidence exists."
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence: []
