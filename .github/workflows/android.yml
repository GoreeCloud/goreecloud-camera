# File internal version: 0.1.0
name: Android Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source and Concept identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"

          APPLICATION_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test "$APPLICATION_ID" = "com.goreecloud.camera"
          test "$VERSION_NAME" = "0.1.0"
          grep -q '^lifecycle: concept$' goreecloud.platform.yaml

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "APPLICATION_ID=$APPLICATION_ID" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Verify foundation source contract
        run: python3 scripts/check_android_foundation.py

      - name: Lint, unit test, and assemble debug APK
        run: gradle --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

      - name: Stage self-verifying Concept-stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          ARTIFACT_ROOT="artifact-camera-android"
          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT"
          cp "$APK" "$ARTIFACT_ROOT/"

          cat > "$ARTIFACT_ROOT/BUILD-PROVENANCE.txt" <<PROVENANCE
          repository=GoreeCloud/goreecloud-camera
          source_sha=$SOURCE_SHA
          version_name=$VERSION_NAME
          application_id=$APPLICATION_ID
          lifecycle=Concept
          compile_sdk=37
          target_sdk=37
          min_sdk=29-provisional
          workflow=$GITHUB_WORKFLOW
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          artifact_role=android-camera-concept-foundation
          signing_role=ci-debug-installability-only
          stable_release_authority=none
          PROVENANCE

          (
            cd "$ARTIFACT_ROOT"
            sha256sum ./*.apk > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload Concept-stage APK evidence
        uses: actions/upload-artifact@v6
        with:
          name: goreecloud-camera-android-concept
          if-no-files-found: error
          path: artifact-camera-android/*
