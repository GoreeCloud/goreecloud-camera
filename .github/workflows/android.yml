# File internal version: 0.2.1
name: Android Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source and Concept identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"

          APPLICATION_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test "$APPLICATION_ID" = "com.goreecloud.camera"
          test "$VERSION_NAME" = "0.1.0"
          grep -q '^lifecycle: concept$' goreecloud.platform.yaml

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "APPLICATION_ID=$APPLICATION_ID" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Provision current Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_VERSION="15859902"
          TOOLS_SHA256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
          TOOLS_ZIP="$RUNNER_TEMP/commandlinetools-linux-${TOOLS_VERSION}_latest.zip"
          TOOLS_ROOT="$RUNNER_TEMP/android-command-line-tools"
          TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-${TOOLS_VERSION}_latest.zip"

          curl --fail --location --silent --show-error "$TOOLS_URL" --output "$TOOLS_ZIP"
          echo "$TOOLS_SHA256  $TOOLS_ZIP" | sha256sum --check --strict
          rm -rf "$TOOLS_ROOT"
          mkdir -p "$TOOLS_ROOT/latest"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_ROOT/unpacked"
          mv "$TOOLS_ROOT/unpacked/cmdline-tools"/* "$TOOLS_ROOT/latest/"
          rm -rf "$TOOLS_ROOT/unpacked"

          echo "ANDROID_CMDLINE_TOOLS=$TOOLS_ROOT/latest/bin" >> "$GITHUB_ENV"

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_CMDLINE_TOOLS/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Verify foundation source contract
        run: python3 scripts/check_android_foundation.py

      - name: Lint, unit test, and assemble debug APK
        run: gradle --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

      - name: Stage self-verifying Concept-stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          ARTIFACT_ROOT="artifact-camera-android"
          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT"
          cp "$APK" "$ARTIFACT_ROOT/"

          cat > "$ARTIFACT_ROOT/BUILD-PROVENANCE.txt" <<PROVENANCE
          repository=GoreeCloud/goreecloud-camera
          source_sha=$SOURCE_SHA
          version_name=$VERSION_NAME
          application_id=$APPLICATION_ID
          lifecycle=Concept
          compile_sdk=37
          target_sdk=37
          min_sdk=29-provisional
          workflow=$GITHUB_WORKFLOW
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          artifact_role=android-camera-concept-foundation
          signing_role=ci-debug-installability-only
          stable_release_authority=none
          PROVENANCE

          (
            cd "$ARTIFACT_ROOT"
            sha256sum ./*.apk > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload Concept-stage APK evidence
        uses: actions/upload-artifact@v6
        with:
          name: goreecloud-camera-android-concept
          if-no-files-found: error
          path: artifact-camera-android/*

  preview-runtime-emulator:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Provision current Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_VERSION="15859902"
          TOOLS_SHA256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
          TOOLS_ZIP="$RUNNER_TEMP/commandlinetools-linux-${TOOLS_VERSION}_latest.zip"
          TOOLS_ROOT="$RUNNER_TEMP/android-command-line-tools"
          TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-${TOOLS_VERSION}_latest.zip"

          curl --fail --location --silent --show-error "$TOOLS_URL" --output "$TOOLS_ZIP"
          echo "$TOOLS_SHA256  $TOOLS_ZIP" | sha256sum --check --strict
          rm -rf "$TOOLS_ROOT"
          mkdir -p "$TOOLS_ROOT/latest"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_ROOT/unpacked"
          mv "$TOOLS_ROOT/unpacked/cmdline-tools"/* "$TOOLS_ROOT/latest/"
          rm -rf "$TOOLS_ROOT/unpacked"
          echo "ANDROID_CMDLINE_TOOLS=$TOOLS_ROOT/latest/bin" >> "$GITHUB_ENV"

      - name: Install Android 17 compile SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_CMDLINE_TOOLS/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Enable KVM group permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Qualify Camera2 preview on Android 16 virtual camera
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: |
            set -eu
            gradle --no-daemon --stacktrace assembleDebug
            APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
            test -n "$APK"

            adb install -r "$APK"
            adb shell pm grant com.goreecloud.camera android.permission.CAMERA
            adb shell am force-stop com.goreecloud.camera
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am start -W -n com.goreecloud.camera/.MainActivity

            EVIDENCE_ROOT="runtime-preview-evidence"
            rm -rf "$EVIDENCE_ROOT"
            mkdir -p "$EVIDENCE_ROOT"

            preview_ready=0
            for attempt in $(seq 1 30); do
              adb shell uiautomator dump /sdcard/goreecloud-camera-window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/goreecloud-camera-window.xml "$EVIDENCE_ROOT/window.xml" >/dev/null 2>&1 || true
              if grep -q 'text="Session: previewing' "$EVIDENCE_ROOT/window.xml" 2>/dev/null; then
                preview_ready=1
                break
              fi
              sleep 1
            done

            adb exec-out screencap -p > "$EVIDENCE_ROOT/preview.png" || true
            adb shell dumpsys media.camera > "$EVIDENCE_ROOT/media-camera.txt" || true
            adb logcat -d -v threadtime > "$EVIDENCE_ROOT/logcat.txt" || true

            cat > "$EVIDENCE_ROOT/RUNTIME-PROVENANCE.txt" <<PROVENANCE
            repository=GoreeCloud/goreecloud-camera
            source_sha=$SOURCE_SHA
            product_version=0.1.0
            lifecycle=Concept
            runtime=Android-16-API-36-emulator
            camera_source=Android-emulated-back-camera
            permission_scope=android.permission.CAMERA-only
            expected_runtime_state=previewing
            evidence_role=representative-emulator-preview-qualification
            physical_device_qualification=false
            stable_release_authority=none
            PROVENANCE

            if [ "$preview_ready" -ne 1 ]; then
              echo "Camera preview did not reach PREVIEWING state." >&2
              cat "$EVIDENCE_ROOT/window.xml" >&2 2>/dev/null || true
              exit 1
            fi

            grep -Eq 'text="Detected camera devices: [1-9][0-9]*"' "$EVIDENCE_ROOT/window.xml"
            echo "Camera2 preview reached PREVIEWING on the Android 16 emulated camera runtime."

      - name: Upload runtime preview evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: goreecloud-camera-runtime-preview
          if-no-files-found: warn
          path: runtime-preview-evidence/*
